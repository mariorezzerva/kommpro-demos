<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KommPro · Panel de Fabio</title>
<meta name="description" content="Panel de KommPro para Xocio's Lico Market y Xocios Lab: ventas en línea, pedidos, existencias por sede y links de pago.">
<meta name="theme-color" content="#0C0F22">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Panel KommPro: barra azul noche con Pervinca, contenido claro. El acento de cada negocio sale de su marca. */
:root{
  --night:#0C0F22; --night-2:#141A36; --peri:#B4C5FF; --peri-2:#8FA6FF; --acc:#4E63C9;
  --bg:#F5F6FB; --card:#fff; --line:#E1E4F0; --text:#171A2E; --muted:#5D6380;
  --ok:#1f9d5c; --warn:#c77700; --bad:#d23c3c;
  --b1:#6a22f0; --b2:#f5c33b; /* acento del negocio activo */
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:268px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--night),var(--night-2));color:#d9def5;padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand svg{width:34px;height:34px}
.word{font:800 22px var(--display);letter-spacing:-.01em;color:#fff;display:flex;align-items:center;gap:6px}
.word span{background:linear-gradient(135deg,var(--peri),var(--peri-2));color:var(--night);border-radius:7px;padding:1px 7px 2px;font-size:16px}
.acct{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid rgba(180,197,255,.16);border-radius:14px;background:rgba(255,255,255,.03)}
.acct .av{width:36px;height:36px;border-radius:50%;background:var(--peri);color:var(--night);display:grid;place-items:center;font:800 15px var(--display)}
.acct b{display:block;color:#fff;font-size:14px}
.acct small{color:#9aa3c8;font-size:12px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#7f88b2;padding:0 6px}
.bizsw{display:grid;gap:8px}
.bizsw button{display:flex;align-items:center;gap:10px;border:1px solid rgba(180,197,255,.14);background:rgba(255,255,255,.03);border-radius:14px;padding:8px 10px;text-align:left;color:#d9def5}
.bizsw button .lg{width:44px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none;overflow:hidden}
.bizsw button .lg img{max-width:40px;max-height:28px}
.bizsw button b{display:block;font-size:13.5px;color:#fff;font-weight:600}
.bizsw button small{font-size:11.5px;color:#9aa3c8}
.bizsw button.on{border-color:var(--peri);background:rgba(180,197,255,.1);box-shadow:inset 3px 0 0 var(--peri)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;text-decoration:none;color:#c5cbe8;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.05)}
.nav a.on{background:rgba(180,197,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--peri)}
.nav a .cnt{margin-left:auto;background:var(--peri);color:var(--night);border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.side .foot{margin-top:auto;font-size:12px;color:#7f88b2;display:grid;gap:6px;padding:0 6px}
.side .foot a{color:#c5cbe8}

main{min-width:0}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .bizlogo{height:38px;width:76px;border-radius:10px;display:grid;place-items:center;overflow:hidden;flex:none}
.top .bizlogo img{max-height:30px;max-width:70px}
.top h1{font-size:21px}
.top small{color:var(--muted);font-size:12.5px;display:block}
.top .grow{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#c6cbe0}
.btn.pri{background:var(--night);color:#fff;border-color:var(--night)}
.btn.pri:hover{background:#1c2450}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:8px}
.content{padding:24px 28px 60px;max-width:1240px}
.mtabs{display:none}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{color:var(--muted);font-size:12.5px}
.kpi b{display:block;font:800 26px var(--display);letter-spacing:-.01em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--ok)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.card h3{font-size:16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card h3 small{font:500 12.5px var(--body);color:var(--muted)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chart svg{width:100%;height:220px;display:block}
.toplist{display:grid;gap:8px}
.toplist div{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.toplist img{width:40px;height:40px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#fff}
.toplist.dark img{object-fit:cover;background:#000}
.toplist b{display:block;font-weight:600;line-height:1.2}
.toplist small{color:var(--muted)}
.sedes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sede{border:1px solid var(--line);border-radius:12px;padding:12px}
.sede b{font:800 15px var(--display)}
.sede .row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.sede .row span:last-child{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}

.sync{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--muted)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,92,.18)}
.pill b{color:var(--text);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 11px;min-width:240px;flex:1;max-width:380px}
.search input{border:0;outline:none;font:15px var(--body);flex:1;min-width:0;background:none}
select.f,input.f{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font:14px var(--body);color:var(--text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:600;color:var(--muted)}
.chips button.on{background:var(--night);border-color:var(--night);color:#fff}

.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:760px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #eef0f6;vertical-align:middle}
th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;background:#fafbfe;position:sticky;top:0;z-index:1}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td .pi{display:flex;align-items:center;gap:10px}
td .pi img{width:40px;height:40px;object-fit:contain;border:1px solid var(--line);border-radius:8px;background:#fff;flex:none}
td .pi.dark img{object-fit:cover;background:#000}
td .pi b{display:block;font-weight:600;line-height:1.2}
td .pi small{color:var(--muted);font-size:12px}
tr.flash td{animation:fl 1.6s}
@keyframes fl{0%{background:#fff5d6}100%{background:transparent}}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stp button{width:28px;height:30px;border:0;background:#fafbfe;font-size:15px}
.stp button:hover{background:#eef1fb}
.stp input{width:46px;border:0;text-align:center;font:600 14px var(--body);font-variant-numeric:tabular-nums;outline:none}
.tot{font:800 15px var(--display);font-variant-numeric:tabular-nums}
.low{color:var(--warn)}.out{color:var(--bad)}
.sw{position:relative;width:38px;height:22px;border-radius:999px;background:#d5d9e8;border:0;transition:background .2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--ok)}.sw.on::after{left:19px}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:#fff4dc;color:#8a5a00;white-space:nowrap}
.st.go{background:#e5f1ff;color:#2952b3}.st.ok{background:#e3f6ec;color:#16784a}
.ord{display:grid;gap:2px}
.ord small{color:var(--muted)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.linkform{display:grid;grid-template-columns:1.2fr .6fr .8fr .8fr auto;gap:10px;align-items:end}
.fld{display:grid;gap:5px}
.fld label{font-size:12px;font-weight:600;color:var(--muted)}
.fld input,.fld select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;font:15px var(--body);background:#fff;width:100%}
.newlink{margin-top:14px;border:1px dashed var(--peri-2);background:#f3f5ff;border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.newlink code{font:600 14px ui-monospace,SFMono-Regular,Menlo,monospace;background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;flex:1;min-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.conn{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.conn .card{display:grid;gap:8px;align-content:start}
.conn .card b{font:800 15px var(--display)}
.conn .card p{margin:0;font-size:13px;color:var(--muted)}

.pick{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(900px 500px at 70% 0%,#1d2550,transparent 70%),var(--night);color:#fff}
.pick .box{width:min(760px,100%);display:grid;gap:22px}
.pick h1{font-size:clamp(30px,5vw,44px)}
.pick p{color:#aab2d6;margin:0}
.pick .biz{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick a{display:grid;gap:14px;text-decoration:none;border:1px solid rgba(180,197,255,.2);border-radius:20px;padding:22px;background:rgba(255,255,255,.04);transition:border-color .2s,transform .2s}
.pick a:hover{border-color:var(--peri);transform:translateY(-2px)}
.pick a .lg{height:90px;border-radius:14px;display:grid;place-items:center}
.pick a .lg img{max-height:70px;max-width:80%}
.pick a b{font:800 19px var(--display)}
.pick a small{color:#aab2d6}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--night);color:#fff;padding:11px 18px;border-radius:999px;font-size:14px;z-index:90;opacity:0;transition:all .3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:rgba(12,15,34,.5);display:grid;place-items:center;padding:16px;z-index:80}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:min(440px,100%);display:grid;gap:12px}

@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.conn{grid-template-columns:1fr}.linkform{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}
  .top .acts{width:100%;display:flex;gap:8px;flex-wrap:wrap}
  .top .acts .btn{padding:7px 10px;font-size:13px}
  .mtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:19}
  .mtabs a{white-space:nowrap;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
  .mtabs a.on{background:var(--night);color:#fff;border-color:var(--night)}
  .mtabs select{border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:600 13px var(--body);background:#fff}
  .content{padding:16px 16px 60px}
  .pick .biz{grid-template-columns:1fr}
  .search{max-width:none}
}
</style>
</head>
<body>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>"₡"+String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm=d=>new Date(d).toLocaleTimeString("es-CR",{hour:"numeric",minute:"2-digit"});
const day=d=>new Date(d).toLocaleDateString("es-CR",{weekday:"short",day:"numeric",month:"short"});
const isToday=d=>new Date(d).toDateString()===new Date().toDateString();
let tt; const toast=m=>{ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("on"),2200); };

const BIZ={
  lico:{name:"Xocio's Lico Market",short:"Lico Market",sub:"Heredia y Tibás",logo:"../img/logo-xocios-lm.webp",lbg:"#231c5c",store:"../index.html",b1:"#6a22f0",b2:"#f5c33b"},
  lab:{name:"Xocios Lab",short:"Xocios Lab",sub:"Perfumería · Heredia",logo:"../img/logo-lab-brush.webp",lbg:"#0b0910",store:"../lab/index.html",b1:"#0b0910",b2:"#d6b26a"}
};
const LP=XO_LICO.products, LPid=Object.fromEntries(LP.map(p=>[p.id,p]));
const labProducts=()=>XO.get("xo-lab-new",[]).concat(XO_LAB.products);
const labImg=p=>p.img.startsWith("data:")?p.img:"../img/"+p.img;
const labPh=XO.get("xo-lab-photos",{});

/* Historia de demo: ventas de días anteriores y pedidos de hoy temprano, fijas por fecha */
function rng(seed){ let s=seed; return ()=>(s=(s*16807)%2147483647)/2147483647; }
function seeded(biz){
  const r=rng(biz==="lico"?7919:104729), today=new Date(); today.setHours(0,0,0,0);
  const days=[];
  for(let d=13; d>=1; d--){ const dt=new Date(today-d*864e5), wk=dt.getDay(), boost=(wk===5||wk===6)?1.8:(wk===0?1.2:1);
    if(biz==="lico") days.push({d:dt,h:Math.round((40000+r()*90000)*boost/100)*100,t:Math.round((30000+r()*80000)*boost/100)*100,n:Math.round((4+r()*8)*boost)});
    else days.push({d:dt,web:Math.round((r()*95000+20000)/100)*100,link:Math.round((r()*70000)/100)*100,n:Math.round(1+r()*4)}); }
  const t0=new Date(); const at=(h,m)=>{ const x=new Date(t0); x.setHours(h,m,0,0); return x.toISOString(); };
  const orders = biz==="lico" ? [
    {num:"XO-2307",time:at(10,12),name:"María Fernanda Solís",mode:"uber",sede:"Heredia",zone:"Santo Domingo, San Isidro, Santa Bárbara",ship:2800,lines:[["silver6",2,6500],["hielo",1,1560],["papiolas",1,2160]],channel:"web",seed:1},
    {num:"XO-2308",time:at(11,40),name:"Esteban Quesada",mode:"retiro",sede:"Tibás",ship:0,lines:[["buchanans12",1,33600],["soda",2,2160]],channel:"web",seed:1},
    {num:"XO-2309",time:at(13,5),name:"Andrea Vargas",mode:"uber",sede:"Tibás",zone:"Tibás, Moravia, Goicoechea",ship:2200,lines:[["combo-centenario",1,12000],["coca3",1,2880]],channel:"web",seed:1}
  ] : [
    {num:"XL-515",time:at(9,50),name:"Natalia Chaves",mode:"correos",ship:3500,lines:[["yara",1,25900]],channel:"web",gift:true,seed:1},
    {num:"XL-516",time:at(12,20),name:"José Pablo Mora",mode:"uber",ship:2200,lines:[["bharara",1,49900]],channel:"link",seed:1}
  ];
  orders.forEach(o=>{ o.total=o.lines.reduce((s,[,q,p])=>s+q*p,0)+(o.ship||0); });
  return {days,orders};
}
const FLOW={uber:["Buscando repartidor","En camino","Entregado"],retiro:["Alistando","Listo para retirar","Entregado"],correos:["Por empacar","Enviado por Correos","Entregado"],link:["Pagado","Entregado"]};
const stKey=b=>"xo-status-"+b;
function orders(biz){
  const real=XO.get(biz==="lico"?"xo-lico-orders":"xo-lab-orders",[]).map(o=>({...o,channel:o.channel||"web"}));
  const paidLinks=XO.links(biz).filter(l=>l.status==="Pagado").map(l=>({num:l.code,time:l.paidAt||l.time,name:l.client||"Cliente",mode:"link",ship:0,lines:l.items||[],total:l.amount,channel:"link",concept:l.concept}));
  const st=XO.get(stKey(biz),{});
  const all=real.concat(paidLinks,seeded(biz).orders).map(o=>{ const f=FLOW[o.mode]||FLOW.uber; const s=st[o.num]||(o.seed?f[Math.min(f.length-1,1)]:o.status||f[0]); return {...o,status:s,flow:f}; });
  return all.sort((a,b)=>new Date(b.time)-new Date(a.time));
}
const pName=(biz,id)=>biz==="lico"?(LPid[id]?LPid[id].name:id):(labProducts().find(p=>p.id===id)||{name:id}).name;
const pImg=(biz,id)=>{ if(biz==="lico") return LPid[id]?"../img/"+LPid[id].img:""; const p=labProducts().find(p=>p.id===id); return p?(labPh[id]||labImg(p)):""; };

/* RESUMEN */
function resumen(){
  const S=seeded(biz), O=orders(biz), today=O.filter(o=>isToday(o.time));
  const ventas=today.reduce((s,o)=>s+o.total,0), n=today.length;
  let kpis, chart, side;
  if(biz==="lico"){
    const st=XO.licoStock(), low=LP.filter(p=>st[p.id].h+st[p.id].t<=6).length;
    const tH=today.filter(o=>o.sede==="Heredia").reduce((s,o)=>s+o.total,0), tT=ventas-tH;
    const days=S.days.concat([{d:new Date(),h:tH,t:tT,today:true}]);
    kpis=[["Ventas en línea hoy",fmt(ventas),`${n} pedidos`],["Ticket promedio",fmt(n?ventas/n:0),"tarjeta por Onvo"],["Uber Flash activos",today.filter(o=>o.mode==="uber"&&o.status!=="Entregado").length,"coordinados por Xocios"],["Por reponer",low,"6 unidades o menos"]];
    chart=bars(days.map(d=>[d.h,d.t]),days,["Heredia","Tibás"],["var(--b1)","var(--b2)"]);
    const totH=LP.reduce((s,p)=>s+st[p.id].h,0), totT=LP.reduce((s,p)=>s+st[p.id].t,0);
    side=`<div class="card"><h3>Sedes <small>hoy</small></h3><div class="sedes">${[["Heredia",tH,today.filter(o=>o.sede==="Heredia").length,totH],["Tibás",tT,today.filter(o=>o.sede==="Tibás").length,totT]].map(([s,v,c,u])=>`<div class="sede"><b>Xocios ${s}</b><div class="row"><span>Ventas web</span><span>${fmt(v)}</span></div><div class="row"><span>Pedidos</span><span>${c}</span></div><div class="row"><span>Unidades en sede</span><span>${u}</span></div></div>`).join("")}</div>
      <p class="note">Cada pedido se descuenta de la sede que lo despacha. La tienda en línea muestra la suma de las dos.</p></div>`;
  } else {
    const st=XO.labStock(), low=labProducts().filter(p=>(st[p.id]??p.stock)<=3).length;
    const tW=today.filter(o=>o.channel!=="link").reduce((s,o)=>s+o.total,0), tL=ventas-tW;
    const days=S.days.concat([{d:new Date(),web:tW,link:tL,today:true}]);
    kpis=[["Ventas hoy",fmt(ventas),`${n} pedidos`],["Por links de pago",fmt(tL),"lo que se vende por WhatsApp"],["Para regalo",today.filter(o=>o.gift).length,"con empaque y tarjeta"],["Por reponer",low,"3 unidades o menos"]];
    chart=bars(days.map(d=>[d.web,d.link]),days,["Tienda en línea","Links de pago"],["#1f1a28","var(--b2)"]);
    const log=XO.get("xo-lab-log",[]).slice(0,5);
    side=`<div class="card"><h3>Celular de la tienda <small>últimos cambios</small></h3>${log.length?`<div class="toplist">${log.map(l=>`<div style="grid-template-columns:1fr auto"><span>${esc(l.txt)}</span><small>${hhmm(l.t)}</small></div>`).join("")}</div>`:`<p class="note" style="margin:0">Hoy a las 9:02 a. m. se subió la existencia del día desde el celular (19 productos).</p>`}<p class="note"><a href="../lab/index.html#panel" target="_blank" rel="noopener">Abrir el celular de la tienda</a></p></div>`;
  }
  const top={}; O.filter(o=>new Date(o.time)>Date.now()-7*864e5).forEach(o=>o.lines.forEach(([id,q,pr])=>{ top[id]=top[id]||[0,0]; top[id][0]+=q; top[id][1]+=q*(pr||0); }));
  const topL=Object.entries(top).sort((a,b)=>b[1][1]-a[1][1]).slice(0,5);
  $("#content").innerHTML=`<div class="kpis">${kpis.map(([l,v,e])=>`<div class="kpi"><small>${l}</small><b>${v}</b><em>${e}</em></div>`).join("")}</div>
    <div class="grid2"><div class="card chart"><h3>Ventas en línea <small>últimos 14 días</small></h3>${chart}</div>${side}</div>
    <div class="grid2"><div class="card"><h3>Pedidos de hoy <a class="btn sm" href="#${biz}-pedidos">Ver todos</a></h3>${miniOrders(today.slice(0,5))}</div>
    <div class="card"><h3>Lo más vendido <small>7 días</small></h3><div class="toplist ${biz==="lab"?"dark":""}">${topL.length?topL.map(([id,[q,v]])=>`<div><img src="${pImg(biz,id)}" alt=""><span><b>${esc(pName(biz,id))}</b><small>${q} unidades</small></span><span>${fmt(v)}</span></div>`).join(""):`<p class="note">Todavía no hay ventas.</p>`}</div></div></div>`;
}
function bars(vals,days,names,cols){
  const W=700,H=210,pad=28,max=Math.max(...vals.map(v=>v[0]+v[1]),1)*1.1, bw=(W-pad)/vals.length;
  const g=vals.map((v,i)=>{ const x=pad+i*bw+bw*.18, w=bw*.64, h0=v[0]/max*(H-30), h1=v[1]/max*(H-30); const d=days[i];
    return `<rect x="${x}" y="${H-12-h0}" width="${w}" height="${h0}" rx="3" fill="${cols[0]}" opacity="${d.today?1:.85}"/><rect x="${x}" y="${H-12-h0-h1}" width="${w}" height="${h1}" rx="3" fill="${cols[1]}" opacity="${d.today?1:.85}"/>
      <text x="${x+w/2}" y="${H}" font-size="10" text-anchor="middle" fill="#5D6380">${d.today?"Hoy":new Date(d.d).getDate()}</text><title>${day(d.d)}: ${fmt(v[0]+v[1])}</title>`; }).join("");
  const grid=[.25,.5,.75,1].map(f=>`<line x1="${pad}" x2="${W}" y1="${H-12-f*(H-30)}" y2="${H-12-f*(H-30)}" stroke="#eef0f6"/><text x="0" y="${H-9-f*(H-30)}" font-size="9.5" fill="#8a90ad">${Math.round(max/1.1*f/1000)}k</text>`).join("");
  return `<div class="legend">${names.map((n,i)=>`<span><i style="background:${cols[i]}"></i>${n}</span>`).join("")}</div><svg viewBox="0 0 ${W} ${H+4}" role="img" aria-label="Ventas de los últimos 14 días">${grid}${g}</svg>`;
}
function delivTxt(o){ return o.mode==="uber"?`Uber Flash${o.sede?" desde "+o.sede:""}`:o.mode==="retiro"?`Retiro${o.sede?" en "+o.sede:" en Heredia"}`:o.mode==="correos"?"Correos de CR":"Link de pago"; }
function stCls(s){ return s==="Entregado"?"ok":/camino|Listo|Enviado|Pagado/.test(s)?"go":""; }
function miniOrders(L){
  if(!L.length) return `<p class="note" style="margin:0">Sin pedidos todavía hoy. Comprá algo en la <a href="${BIZ[biz].store}" target="_blank" rel="noopener">tienda de demo</a> y aparece aquí.</p>`;
  return `<div class="toplist" style="gap:10px">${L.map(o=>`<div style="grid-template-columns:1fr auto auto"><span><b>${o.num} · ${esc(o.name)}</b><small>${hhmm(o.time)} · ${delivTxt(o)}</small></span><span class="st ${stCls(o.status)}">${o.status}</span><span style="min-width:80px;text-align:right">${fmt(o.total)}</span></div>`).join("")}</div>`;
}

/* PEDIDOS */
let ordFilter="activos";
function pedidos(){
  const O=orders(biz);
  const F={activos:o=>o.status!=="Entregado",hoy:o=>isToday(o.time),todos:()=>true};
  const L=O.filter(F[ordFilter]);
  $("#content").innerHTML=`<div class="tools"><div class="chips">${[["activos","Por atender"],["hoy","Hoy"],["todos","Todos"]].map(([k,l])=>`<button data-of="${k}" class="${k===ordFilter?'on':''}">${l}</button>`).join("")}</div><span class="note" style="margin:0 0 0 auto">${biz==="lico"?"El Uber Flash lo pide Xocios desde la sede que despacha.":"Uber Flash en la GAM, Correos al resto del país."}</span></div>
    <div class="tbl"><table><thead><tr><th>Pedido</th><th>Cliente</th><th>Productos</th><th>Entrega</th><th>Estado</th><th class="n">Total</th><th></th></tr></thead><tbody>
    ${L.length?L.map(o=>{ const i=o.flow.indexOf(o.status), nx=o.flow[i+1];
      return `<tr><td><div class="ord"><b>${o.num}</b><small>${isToday(o.time)?"Hoy":day(o.time)} · ${hhmm(o.time)}</small></div></td><td>${esc(o.name)}${o.gift?`<br><small class="note">Para regalo</small>`:""}</td>
      <td style="max-width:300px">${o.lines.length?o.lines.map(([id,q])=>`${q}× ${esc(pName(biz,id))}`).join("<br>"):esc(o.concept||"")}</td>
      <td>${delivTxt(o)}${o.zone?`<br><small class="note">${esc(o.zone)}</small>`:""}</td><td><span class="st ${stCls(o.status)}">${o.status}</span></td><td class="n"><b>${fmt(o.total)}</b></td>
      <td>${nx?`<button class="btn sm" data-next="${o.num}" data-to="${nx}">${nx==="En camino"?"Repartidor asignado":nx==="Listo para retirar"?"Marcar listo":nx==="Enviado por Correos"?"Marcar enviado":"Marcar entregado"}</button>`:""}</td></tr>`; }).join(""):`<tr><td colspan="7" class="note">No hay pedidos en esta vista.</td></tr>`}
    </tbody></table></div>`;
  document.querySelectorAll("[data-of]").forEach(b=>b.onclick=()=>{ ordFilter=b.dataset.of; pedidos(); });
  document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{ const st=XO.get(stKey(biz),{}); st[b.dataset.next]=b.dataset.to; XO.set(stKey(biz),st); toast(`${b.dataset.next}: ${b.dataset.to}`); pedidos(); });
}

/* INVENTARIO */
let invQ="", invCat="all", invLow=false, flashId=null;
function inventario(){ biz==="lico"?invLico():invLab(); }
function invLico(){
  const st=XO.licoStock();
  let L=LP.filter(p=>(invCat==="all"||p.cat===invCat)&&(!invQ||norm(p.name+" "+p.pres+" "+p.barcode).includes(norm(invQ))));
  if(invLow) L=L.filter(p=>st[p.id].h+st[p.id].t<=6);
  const totH=LP.reduce((s,p)=>s+st[p.id].h,0), totT=LP.reduce((s,p)=>s+st[p.id].t,0);
  $("#content").innerHTML=`<div class="sync"><span class="pill"><i></i><b>Caja Xocios Heredia</b> sincronizada · hace 2 min</span><span class="pill"><i></i><b>Caja Xocios Tibás</b> sincronizada · hace 1 min</span><span class="pill"><b>${LP.length}</b> productos · <b>${totH}</b> u. Heredia · <b>${totT}</b> u. Tibás</span></div>
    <div class="tools"><label class="search"><svg class="ic" style="color:var(--muted)"><use href="#i-search"/></svg><input id="invQ" type="search" placeholder="Buscar por nombre o código de barras" value="${esc(invQ)}"></label>
      <select class="f" id="invCat"><option value="all">Todos los pasillos</option>${XO_LICO.cats.map(c=>`<option value="${c.id}" ${c.id===invCat?"selected":""}>${c.name}</option>`).join("")}</select>
      <div class="chips"><button id="invLow" class="${invLow?'on':''}">Por reponer</button></div>
      <span style="margin-left:auto;display:flex;gap:8px"><label class="btn"><svg class="ic"><use href="#i-up"/></svg>Importar export del POS<input type="file" id="csvIn" accept=".csv,.txt" hidden></label><button class="btn" id="csvOut"><svg class="ic"><use href="#i-down"/></svg>Descargar CSV</button></span></div>
    <div class="tbl"><table><thead><tr><th>Producto</th><th>Pasillo</th><th class="n">Precio</th><th class="n">Heredia</th><th class="n">Tibás</th><th class="n">En la web</th><th>En línea</th><th></th></tr></thead><tbody>
    ${L.slice(0,120).map(p=>{ const s=st[p.id], t=s.h+s.t, c=t<=0?"out":t<=6?"low":"";
      return `<tr data-row="${p.id}" class="${flashId===p.id?'flash':''}"><td><div class="pi"><img src="../img/${p.img}" alt=""><span><b>${esc(p.name)}</b><small>${esc(p.pres)}${p.barcode?" · "+p.barcode:""}</small></span></div></td><td>${XO_LICO.cats.find(c=>c.id===p.cat).name}</td><td class="n">${fmt(p.price)}</td>
      <td class="n">${stepper(p.id,"h",s.h)}</td><td class="n">${stepper(p.id,"t",s.t)}</td><td class="n"><span class="tot ${c}">${s.on?t:"Oculto"}</span></td>
      <td><button class="sw ${s.on?'on':''}" data-on="${p.id}" aria-label="Vender en línea ${esc(p.name)}"></button></td><td><button class="btn sm" data-tr="${p.id}" title="Pasar unidades de una sede a otra"><svg class="ic" style="width:15px;height:15px"><use href="#i-swap"/></svg>Transferir</button></td></tr>`; }).join("")}
    </tbody></table></div>
    <p class="note">${L.length>120?`Mostrando 120 de ${L.length}. Usá el buscador para encontrar el resto. `:""}Lo que cambiés aquí sale en la tienda en línea al instante. Al conectar el POS de cada sede, la existencia se actualiza sola con cada venta en caja, y cada venta en línea se descuenta de la sede que despacha.</p>`;
  bindInv();
}
function stepper(id,k,v){ return `<span class="stp"><button data-d="-1" data-id="${id}" data-k="${k}" aria-label="Restar">−</button><input value="${v}" inputmode="numeric" data-id="${id}" data-k="${k}" aria-label="Existencia"><button data-d="1" data-id="${id}" data-k="${k}" aria-label="Sumar">+</button></span>`; }
function bindInv(){
  const q=$("#invQ"); q.oninput=()=>{ invQ=q.value; const p=q.selectionStart; inventario(); const n=$("#invQ"); n.focus(); n.setSelectionRange(p,p); };
  const c=$("#invCat"); if(c) c.onchange=()=>{ invCat=c.value; inventario(); };
  const lw=$("#invLow"); lw.onclick=()=>{ invLow=!invLow; inventario(); };
  const setV=(id,k,v)=>{ flashId=id;
    if(biz==="lico"){ const s=XO.licoStock()[id]; s[k]=Math.max(0,v); XO.setLicoStock(id,s.h,s.t,s.on); }
    else XO.setLabStock(id,v,"Panel"); inventario(); setTimeout(()=>flashId=null,50); };
  document.querySelectorAll(".stp button").forEach(b=>b.onclick=()=>{ const id=b.dataset.id,k=b.dataset.k; const cur=biz==="lico"?XO.licoStock()[id][k]:XO.labStock()[id]; setV(id,k,cur+Number(b.dataset.d)); });
  document.querySelectorAll(".stp input").forEach(i=>i.onchange=()=>setV(i.dataset.id,i.dataset.k,parseInt(i.value)||0));
  document.querySelectorAll("[data-on]").forEach(b=>b.onclick=()=>{ const id=b.dataset.on; const s=XO.licoStock()[id]; XO.setLicoStock(id,s.h,s.t,!s.on); toast(s.on?"Oculto en la tienda en línea":"Visible en la tienda en línea"); inventario(); });
  document.querySelectorAll("[data-tr]").forEach(b=>b.onclick=()=>transfer(b.dataset.tr));
  const ci=$("#csvIn"); if(ci) ci.onchange=e=>importCSV(e.target.files[0]);
  const co=$("#csvOut"); if(co) co.onclick=exportCSV;
}
function transfer(id){
  const p=LPid[id], s=XO.licoStock()[id];
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="box"><h3>Transferir entre sedes</h3><div class="pi" style="display:flex;gap:10px;align-items:center"><img src="../img/${p.img}" style="width:48px;height:48px;object-fit:contain;border:1px solid var(--line);border-radius:8px"><span><b>${esc(p.name)}</b><br><small class="note">Heredia ${s.h} · Tibás ${s.t}</small></span></div>
    <div class="fld"><label>De</label><select id="trF"><option value="h">Heredia a Tibás</option><option value="t">Tibás a Heredia</option></select></div>
    <div class="fld"><label>Unidades</label><input id="trN" type="number" min="1" value="1" inputmode="numeric"></div>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="trX">Cancelar</button><button class="btn pri" id="trOk">Transferir</button></div></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m||e.target.id==="trX") m.remove(); };
  $("#trOk").onclick=()=>{ const f=$("#trF").value, n=Math.max(0,Math.min(parseInt($("#trN").value)||0,s[f])); const o=f==="h"?"t":"h"; s[f]-=n; s[o]+=n; XO.setLicoStock(id,s.h,s.t,s.on); m.remove(); flashId=id; toast(`${n} ${n===1?"unidad pasó":"unidades pasaron"} a ${o==="h"?"Heredia":"Tibás"}`); inventario(); };
}
function exportCSV(){
  const st=XO.licoStock();
  const rows=[["codigo_barras","producto","presentacion","precio","heredia","tibas"]].concat(LP.map(p=>[p.barcode,p.name,p.pres,p.price,st[p.id].h,st[p.id].t]));
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"})); a.download="xocios-existencia.csv"; a.click();
}
function importCSV(file){
  if(!file) return; const rd=new FileReader();
  rd.onload=()=>{ const lines=rd.result.replace(/\r/g,"").split("\n").filter(Boolean); const head=lines[0].toLowerCase().split(/[,;]/).map(h=>h.replace(/"/g,"").trim());
    const iB=head.findIndex(h=>/barra|barcode|codigo/.test(h)), iH=head.findIndex(h=>/heredia/.test(h)), iT=head.findIndex(h=>/tib/.test(h));
    if(iB<0||(iH<0&&iT<0)){ toast("El archivo necesita código de barras y existencia de Heredia o Tibás"); return; }
    const byB=Object.fromEntries(LP.filter(p=>p.barcode).map(p=>[p.barcode,p])); let n=0;
    lines.slice(1).forEach(l=>{ const c=l.match(/("([^"]|"")*"|[^,;]*)/g).filter((x,i,a)=>i%2===0||x!=="").map(x=>x.replace(/^"|"$/g,"").replace(/""/g,'"').trim());
      const p=byB[c[iB]]; if(!p) return; const s=XO.licoStock()[p.id]; XO.setLicoStock(p.id,iH>=0?parseInt(c[iH])||0:s.h,iT>=0?parseInt(c[iT])||0:s.t,s.on); n++; });
    toast(`${n} productos actualizados desde el archivo`); inventario(); };
  rd.readAsText(file);
}
function invLab(){
  const st=XO.labStock();
  let L=labProducts().filter(p=>!invQ||norm(p.name+" "+p.brand).includes(norm(invQ)));
  if(invLow) L=L.filter(p=>(st[p.id]??p.stock)<=3);
  const log=XO.get("xo-lab-log",[]);
  $("#content").innerHTML=`<div class="sync"><span class="pill"><i></i><b>Vitrina Heredia</b> · última carga desde el celular ${log.length?hhmm(log[0].t):"9:02 a. m."}</span><span class="pill"><b>${labProducts().length}</b> productos · <b>${L.reduce((s,p)=>s+(st[p.id]??p.stock),0)}</b> unidades</span></div>
    <div class="tools"><label class="search"><svg class="ic" style="color:var(--muted)"><use href="#i-search"/></svg><input id="invQ" type="search" placeholder="Buscar perfume o marca" value="${esc(invQ)}"></label><div class="chips"><button id="invLow" class="${invLow?'on':''}">Por reponer</button></div>
      <a class="btn pri" style="margin-left:auto" href="../lab/index.html#panel" target="_blank" rel="noopener"><svg class="ic"><use href="#i-phone"/></svg>Abrir el celular de la tienda</a></div>
    <div class="tbl"><table><thead><tr><th>Producto</th><th>Para</th><th class="n">Precio</th><th class="n">Existencia</th><th>Último cambio</th></tr></thead><tbody>
    ${L.map(p=>{ const v=st[p.id]??p.stock, c=v<=0?"out":v<=3?"low":""; const lc=log.find(l=>l.txt.includes(p.name));
      return `<tr class="${flashId===p.id?'flash':''}"><td><div class="pi dark"><img src="${labPh[p.id]||labImg(p)}" alt=""><span><b>${esc(p.name)}</b><small>${esc(p.brand)} · ${esc(p.ml)}${p.isNew?" · nuevo desde el celular":""}</small></span></div></td><td>${p.g==="m"?"Él":p.g==="f"?"Ella":"Unisex"}</td><td class="n">${fmt(p.price)}</td><td class="n"><span class="${c}">${stepper(p.id,"n",v)}</span></td><td><small class="note">${lc?hhmm(lc.t)+" · "+esc(lc.txt.split(":")[0]):"Carga del día"}</small></td></tr>`; }).join("")}
    </tbody></table></div><p class="note">Xocios Lab no tiene POS: la existencia la sube la persona de la tienda desde el celular (toma foto, ajusta y sube). También se puede ajustar aquí. Cada venta en línea o por link de pago la rebaja sola.</p>`;
  bindInv();
}

/* LINKS DE PAGO */
function links(){
  const L=XO.links(biz), prods=biz==="lico"?LP:labProducts();
  $("#content").innerHTML=`<div class="card" style="margin-bottom:14px"><h3>Nuevo link de pago <small>${biz==="lab"?"para lo que se vende por WhatsApp e Instagram":"para pedidos por WhatsApp o eventos"}</small></h3>
    <div class="linkform">
      <div class="fld"><label for="lP">Producto (opcional)</label><select id="lP"><option value="">Monto libre</option>${prods.map(p=>`<option value="${p.id}">${esc((p.brand?p.brand+" · ":"")+p.name)} · ${fmt(p.price)}</option>`).join("")}</select></div>
      <div class="fld"><label for="lA">Monto</label><input id="lA" inputmode="numeric" placeholder="₡"></div>
      <div class="fld"><label for="lC">Cliente</label><input id="lC" placeholder="Nombre"></div>
      <div class="fld"><label for="lW">WhatsApp</label><input id="lW" inputmode="tel" placeholder="8888-1234"></div>
      <button class="btn pri" id="lGo" style="height:42px">Crear link</button>
    </div>
    <div class="fld" style="margin-top:10px"><label for="lN">Concepto</label><input id="lN" placeholder="${biz==="lab"?"Ej. Bharara King 100 ml, envío por Correos":"Ej. Pedido para evento, 4 six pack + hielo"}"></div>
    <div id="lOut"></div></div>
    <div class="tbl"><table><thead><tr><th>Link</th><th>Concepto</th><th>Cliente</th><th>Creado</th><th>Estado</th><th class="n">Monto</th><th></th></tr></thead><tbody>
    ${L.length?L.map(l=>`<tr><td><b>${l.code}</b></td><td>${esc(l.concept)}</td><td>${esc(l.client||"")}</td><td>${day(l.time)} · ${hhmm(l.time)}</td><td><span class="st ${l.status==="Pagado"?"ok":""}">${l.status}</span></td><td class="n"><b>${fmt(l.amount)}</b></td><td style="white-space:nowrap"><button class="btn sm" data-cp="${l.code}"><svg class="ic" style="width:14px;height:14px"><use href="#i-copy"/></svg>Copiar</button> ${l.status!=="Pagado"?`<button class="btn sm" data-pay="${l.code}" title="En la demo, simula que el cliente pagó">Simular pago</button>`:""}</td></tr>`).join(""):`<tr><td colspan="7" class="note">Todavía no hay links. Creá uno arriba: el cliente lo abre en el celular y paga con tarjeta por Onvo.</td></tr>`}
    </tbody></table></div>
    <p class="note">El link abre una página de pago con la marca de ${BIZ[biz].name}. Cuando el cliente paga, la venta entra a Pedidos y, si escogiste un producto, se rebaja de la existencia.</p>`;
  const lP=$("#lP"); lP.onchange=()=>{ const p=prods.find(x=>x.id===lP.value); if(p){ $("#lA").value=p.price; $("#lN").value=(p.brand?p.brand+" ":"")+p.name+" "+(p.ml||p.pres||""); } };
  $("#lGo").onclick=()=>{ const amount=parseInt(($("#lA").value||"").replace(/\D/g,"")); const concept=$("#lN").value.trim()||"Pago "+BIZ[biz].name;
    if(!amount){ toast("Poné el monto"); return; }
    const l=XO.addLink(biz,{amount,concept,client:$("#lC").value.trim(),wa:$("#lW").value.trim(),items:lP.value?[[lP.value,1,amount]]:[]});
    const url=`https://pay.kommpro.com/${biz==="lab"?"xocioslab":"xocios"}/${l.code}`;
    const msg=encodeURIComponent(`Hola${l.client?" "+l.client.split(" ")[0]:""}, este es tu link para pagar ${concept} (${fmt(amount)}) con tarjeta: ${url}`);
    const wa=l.wa?`https://wa.me/506${l.wa.replace(/\D/g,"")}?text=${msg}`:`https://wa.me/?text=${msg}`;
    links(); $("#lOut").innerHTML=`<div class="newlink"><code>${url}</code><button class="btn" data-cp="${l.code}"><svg class="ic"><use href="#i-copy"/></svg>Copiar</button><a class="btn pri" href="${wa}" target="_blank" rel="noopener">Enviar por WhatsApp</a></div>`; bindLinks(); };
  bindLinks();
}
function bindLinks(){
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>{ const url=`https://pay.kommpro.com/${biz==="lab"?"xocioslab":"xocios"}/${b.dataset.cp}`; (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(()=>toast("Link copiado"),()=>toast(url)); });
  document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{ const L=XO.links(biz); const l=L.find(x=>x.code===b.dataset.pay); l.status="Pagado"; l.paidAt=new Date().toISOString(); XO.set("xo-links-"+biz,L);
    (l.items||[]).forEach(([id,q])=>{ if(biz==="lab") XO.setLabStock(id,(XO.labStock()[id]||0)-q,"Link de pago"); else { const s=XO.licoStock()[id]; const t=Math.min(q,s.h); XO.setLicoStock(id,s.h-t,Math.max(0,s.t-(q-t)),s.on); } });
    toast(`${l.code} pagado: ${fmt(l.amount)}`); links(); });
}

    ["Instagram @xocios.lab","Por conectar","Los productos se pueden etiquetar en los posts para comprar directo.","Pendiente"],
    ["Factura electrónica","Por conectar","Se emite con el sistema de facturación de Xocios.","Pendiente"],
    ["Asesoría de fragancias","Activo","Recomienda por persona, familia olfativa y presupuesto con lo que hay en vitrina.","IA al salir en vivo"]
  ];
  $("#content").innerHTML=`<div class="conn">${c.map(([t,s,d,f])=>`<div class="card"><b>${t}</b><span class="st ${/Conectada|Activo/.test(s)?"ok":/Coordinado/.test(s)?"go":""}" style="justify-self:start">${s}</span><p>${d}</p><small class="note" style="margin:0">${f}</small></div>`).join("")}</div>
    ${biz==="lico"?`<div class="card" style="margin-top:14px"><h3>Cómo se ligan las dos licoreras</h3><p class="note" style="margin:0">Cada sede tiene su propia existencia en su caja. KommPro lee las dos y la tienda en línea vende la suma. Cuando entra un pedido, se asigna a la sede que lo despacha (la más cercana para Uber Flash, o la que el cliente escoge para retirar) y se rebaja de esa sede. Si una sede no tiene suficiente, se completa con la otra y aparece como transferencia pendiente. Mientras el POS no esté conectado, se puede subir el export del POS desde Inventario por sede.</p></div>`:""}`;
}

render();
</script>
